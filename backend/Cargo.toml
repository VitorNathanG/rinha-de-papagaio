[package]
name = "papagaio-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
bytemuck = "1.18"
libm = "0.2"
memchr = "2.7"
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Same codegen as release com debug info completo (DWARF inline DIEs +
# .debug_info) pra `perf annotate` mostrar fonte interlaçado e
# `perf report --inline` expandir inlines de handle::{{closure}}. Custo
# runtime: zero (debug info fica numa seção separada). Custo binário:
# ~10-20x mais bytes, mas a imagem profiling não vai pra produção.
[profile.profiling]
inherits = "release"
debug = "full"
strip = false
