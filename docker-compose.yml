services:
  api1:
    build:
      context: ./backend
    image: papagaio-api:latest
    container_name: papagaio-api1
    volumes:
      - ./data:/app/data:ro
      - sockets:/var/run/papagaio
    environment:
      REFS_PATH: /app/data/box_b_refs.bin
      LABELS_PATH: /app/data/box_b_labels.bin
      WEIGHTS_PATH: /app/data/router_weights.bin
      BIND_ADDR: /var/run/papagaio/api1.sock
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "120MB"

  api2:
    image: papagaio-api:latest
    container_name: papagaio-api2
    depends_on:
      - api1
    volumes:
      - ./data:/app/data:ro
      - sockets:/var/run/papagaio
    environment:
      REFS_PATH: /app/data/box_b_refs.bin
      LABELS_PATH: /app/data/box_b_labels.bin
      WEIGHTS_PATH: /app/data/router_weights.bin
      BIND_ADDR: /var/run/papagaio/api2.sock
    deploy:
      resources:
        limits:
          cpus: "0.425"
          memory: "120MB"

  lb:
    image: nginx:alpine
    container_name: papagaio-lb
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - sockets:/var/run/papagaio
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "30MB"

volumes:
  sockets:
