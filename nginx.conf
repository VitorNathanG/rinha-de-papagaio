worker_processes 1;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    access_log off;
    error_log /dev/stderr warn;

    # Disable Nagle for nginx → client (small responses).
    tcp_nodelay on;
    tcp_nopush on;
    sendfile on;
    keepalive_timeout 65;
    keepalive_requests 100000;

    upstream papagaio_api {
        # UNIX-domain sockets shared via the `sockets` named volume — bypass
        # the kernel TCP stack between nginx and the API replicas.
        server unix:/var/run/papagaio/api1.sock;
        server unix:/var/run/papagaio/api2.sock;
        keepalive 256;
    }

    server {
        listen 9999 default_server backlog=4096;

        location / {
            proxy_pass http://papagaio_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
