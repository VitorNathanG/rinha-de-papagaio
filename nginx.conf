worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

# Pure TCP load balancing — no HTTP parsing, no header validation, no
# request/response buffering. Client bytes are spliced straight to the
# upstream socket and back. Trade-off: load balancing is per-connection
# (HTTP keep-alive sticks all requests on a connection to the same
# upstream), which is fine because k6 fans out across many VUs.
#
# Upstream still uses UNIX-domain sockets — same-host means no kernel TCP
# stack between nginx and the API replicas. Cross-host would swap these
# to `server papagaio-apiN:9999` without any other change.
stream {
    upstream papagaio_api {
        server unix:/var/run/papagaio/api1.sock;
        server unix:/var/run/papagaio/api2.sock;
    }

    server {
        # reuseport: hand the listen socket to the kernel's SO_REUSEPORT
        # accept-distribution — single worker still benefits from a
        # cleaner accept path.
        listen 9999 reuseport backlog=4096;
        proxy_pass papagaio_api;
        proxy_connect_timeout 1s;
        proxy_timeout 30s;
    }
}
